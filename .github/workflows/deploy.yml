# push 하면 → 미리 만들어 둔 단일 파일 앱을 GitHub Pages 에 그대로 올린다.
#
# 빌드를 여기서 하지 않는 이유: 통합본(검토+비교)은 두 엔진을 한 파일로 묶은 것이라
# 두 소스 트리가 모두 있어야 만들어진다. 그런데 이 저장소는 공개용이라 감사 자료와
# 시험 자료를 담지 않는다. 그래서 **로컬에서 검증을 마친 파일 그대로** 올린다 —
# 빌드 실패로 배포가 막힐 일이 없고, 확인한 그 파일이 그대로 서비스된다.
name: 배포 (build & deploy to Pages)

on:
  push:
    branches: [main]
  # Actions 탭에서 손으로도 돌릴 수 있게 한다 (배포만 다시 하고 싶을 때).
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 마지막 것만 살린다. 중간 것을 취소하지는 않는다(배포 중 중단 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages 로 낼 파일 모으기
        run: |
          mkdir -p _site
          # 주소를 열면 바로 앱이 뜬다. 검토와 비교가 이 한 파일 안에 있다.
          cp "앱/감사보고서_도구.html" _site/index.html
          cp "앱/감사보고서_도구.html" "_site/감사보고서_도구.html"

          # 예전에 공유된 내려받기 주소가 죽지 않게 같은 파일을 옛 이름으로도 둔다.
          # 옛 이름으로 받아도 최신 통합본을 얻는다.
          cp "앱/감사보고서_도구.html" "_site/감사보고서_검토.html"

          # 예전 비교앱 주소(/compare/)로 들어온 사람은 통합본의 비교 화면으로 보낸다.
          mkdir -p _site/compare
          cp "앱/compare-redirect.html" _site/compare/index.html
          cp "앱/감사보고서_도구.html" "_site/compare/감사보고서_비교.html"

          test -f README.md && cp README.md _site/README.md || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
