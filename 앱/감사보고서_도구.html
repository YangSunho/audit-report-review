<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARI</title>
<style>
/*
  DESIGN_superhuman.md 를 따른다.

  가장 큰 결정 하나: **캔버스가 순백이 아니다.** 따뜻한 양피지(#f2f0eb) 위에
  흰 카드가 떠오르는 구조다. 순백 배경에 회색 카드를 얹으면 아무리 다듬어도
  차갑고 밋밋한데, 이 한 가지를 바꾸면 화면 전체의 격이 달라진다.

  두 번째: **헤드라인은 굵기 460 으로 속삭인다.** 큰 글자를 굵게 하면 소리치는
  느낌이 되고, 얇게 하되 크고 자간을 조이면 자신감으로 읽힌다.

  색은 아껴 쓴다 — 와인(#421d24)은 주요 동작 하나, 바이올렛(#714cb6)은 링크,
  라일락(#d4c7ff)은 선택 상태. 그림자는 쓰지 않는다. 깊이는 겹침에서 온다.
*/
:root{
  --wine:#421d24;
  --violet:#714cb6;
  --lilac:#d4c7ff;
  --lagoon:#0c4243;
  --parchment:#f2f0eb;
  --mist:#e3e3e2;
  --charcoal:#292827;
  --stone:#666666;
  --paper:#ffffff;

  --r-tab:8px;
  --r-card:16px;
  --r-btn:16px;
  --r-sm:8px;
  --r-full:999px;

  --sans:"Pretendard Variable",Pretendard,Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--parchment);color:var(--charcoal);font-family:var(--sans);
  font-size:16px;line-height:1.5;font-weight:460;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:var(--lilac);color:var(--charcoal)}
.tab{font-variant-numeric:tabular-nums}

.shell{max-width:1200px;margin:0 auto;padding:0 40px}
@media (max-width:760px){ .shell{padding:0 20px} }

/* ── 헤더 — 투명 + 흐림. 스크롤이 시작될 때만 경계가 나타난다 ── */
.hdr{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--parchment) 72%,transparent);
  border-bottom:1px solid transparent;transition:border-color .25s}
.hdr.stuck{border-bottom-color:var(--mist)}
.hdrin{display:flex;align-items:center;gap:24px;width:100%}
.logo{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;
  font-family:inherit;color:inherit;cursor:pointer}
.logo .n{font-size:20px;font-weight:600;letter-spacing:-.022em}
.logo .t{font-size:14px;color:var(--stone)}
@media (max-width:600px){ .logo .t{display:none} }

/* 탭 — 흰 트랙, 선택은 라일락 채움 */
.tabs{margin-left:auto;display:inline-flex;background:var(--paper);
  border:1px solid var(--mist);border-radius:var(--r-tab);padding:3px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:6px;padding:7px 20px;
  font-family:inherit;font-size:15px;font-weight:460;color:var(--stone);cursor:pointer;
  transition:background .18s,color .18s;letter-spacing:-.008em}
.tabs button:hover{color:var(--charcoal)}
.tabs button.on{background:var(--lilac);color:var(--charcoal);font-weight:540}

/* ── 화면 ── */
.view{position:relative;padding:56px 0 0}
/* 사진을 쓸 수 없으니 분위기는 그라디언트가 낸다. 아주 옅게, 글자 뒤로만. */
.glow{position:absolute;inset:-140px 0 auto 0;height:620px;pointer-events:none;z-index:0;
  background:
    radial-gradient(30% 40% at 78% 8%, rgba(212,199,255,.55), transparent 68%),
    radial-gradient(26% 34% at 96% 34%, rgba(113,76,182,.16), transparent 70%),
    radial-gradient(34% 30% at 8% 4%, rgba(212,199,255,.28), transparent 72%);
  filter:blur(30px);
  -webkit-mask-image:linear-gradient(180deg,#000 48%,transparent);
  mask-image:linear-gradient(180deg,#000 48%,transparent)}
.view .shell{position:relative;z-index:1}

h1{font-size:56px;line-height:1.02;letter-spacing:-.018em;font-weight:460;margin:0 0 40px}
/* 제목 옆 영문 — 부제를 없애도 허전하지 않게 격을 만든다 */
h1 .en{font-size:.3em;font-weight:460;color:var(--stone);letter-spacing:-.004em;
  margin-left:.42em;vertical-align:.34em}
@media (max-width:760px){ h1{font-size:40px;line-height:1.08;letter-spacing:-.014em;margin-bottom:30px} }
.sub{font-size:18px;color:var(--stone);margin:0 0 36px;max-width:56ch;line-height:1.5;font-weight:460}

/* 투입 자리 — 양피지 위에 뜬 흰 카드 */
.drop{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r-card);
  padding:56px 28px;text-align:center;cursor:pointer;transition:.2s}
.drop:hover{border-color:var(--charcoal)}
.drop.over{background:var(--lilac);border-color:var(--charcoal)}
.drop .a{font-size:22px;font-weight:460;letter-spacing:-.014em}
.drop .b{font-size:15px;color:var(--stone);margin-top:9px}
.drop .b code{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:13.5px;background:var(--parchment);border:1px solid var(--mist);
  border-radius:5px;padding:1px 6px;color:var(--charcoal)}

.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
@media (max-width:760px){ .slots{grid-template-columns:1fr} .swap{justify-self:center} }
.slot{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r-card);
  padding:28px 24px;cursor:pointer;min-height:128px;display:flex;flex-direction:column;
  justify-content:center;transition:.2s}
.slot:hover{border-color:var(--charcoal)}
.slot.over{background:var(--lilac);border-color:var(--charcoal)}
.slot .k{font-size:12px;color:var(--stone);margin-bottom:9px;letter-spacing:.02em}
.slot .v{font-size:17px;font-weight:540;word-break:break-all;line-height:1.35}
.slot .v.empty{color:var(--stone);font-weight:460}
.swap{width:40px;height:40px;border-radius:var(--r-full);border:1px solid var(--mist);
  background:var(--paper);color:var(--stone);font-size:16px;cursor:pointer;padding:0;line-height:1;
  transition:.25s}
.swap:hover{color:var(--charcoal);border-color:var(--charcoal);transform:rotate(180deg)}

.shelf{margin-top:14px;background:var(--paper);border:1px solid var(--mist);
  border-radius:var(--r-card);padding:18px 20px 20px}
.shelf .sh{font-size:12px;color:var(--stone);margin-bottom:14px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .empty{font-size:15px;color:var(--stone)}
.chip{display:inline-flex;align-items:center;gap:9px;background:var(--parchment);
  border:1px solid var(--mist);border-radius:var(--r-full);padding:7px 12px 7px 16px;
  font-family:inherit;font-size:14px;font-weight:460;color:var(--charcoal);cursor:pointer;
  max-width:100%;transition:.16s}
.chip:hover{border-color:var(--charcoal)}
.chip.on{background:var(--lilac);border-color:var(--charcoal)}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.chip .sl{font-size:12px;color:var(--wine);font-weight:540}
.chip .x{font-size:16px;line-height:1;color:var(--stone);padding:0 2px}
.chip .x:hover{color:var(--wine)}

/* 버튼 — 와인 채움 하나, 나머지는 라일락·고스트 */
.bar{display:flex;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:16px;font-weight:460;cursor:pointer;transition:.18s;
  letter-spacing:-.008em;border:1px solid transparent}
.btn.wine{background:var(--wine);color:var(--paper);border-radius:var(--r-btn);padding:13px 26px}
.btn.wine:hover:not(:disabled){background:#59262f}
.btn.wine:disabled{background:var(--mist);color:var(--stone);cursor:default}
.btn.lilac{background:var(--lilac);color:var(--charcoal);border-color:var(--charcoal);
  border-radius:var(--r-sm);padding:7px 16px;font-size:15px}
.btn.lilac:hover{background:#c7b6ff}
.btn.ghost{background:transparent;color:var(--charcoal);border-color:var(--mist);
  border-radius:var(--r-sm);padding:7px 16px;font-size:15px}
.btn.ghost:hover{border-color:var(--charcoal)}
.note{font-size:15px;color:var(--stone)}
.note b{color:var(--charcoal);font-weight:540}

.warn{background:var(--lilac);color:var(--charcoal);border-radius:var(--r-card);
  padding:20px 24px;margin:0 0 36px;font-size:16px;line-height:1.5}
.warn b{font-weight:700}
.warn[hidden]{display:none}
.err{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r-card);
  padding:16px 20px;margin-top:20px;display:none;font-size:15px;white-space:pre-wrap}

.spin{display:inline-block;width:14px;height:14px;border:1.5px solid var(--mist);
  border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }

/* ── 결과 — 양피지 위의 흰 카드. 그림자는 쓰지 않는다 ── */
#cards,#dcards{margin-top:36px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:1px solid var(--mist);border-radius:var(--r-card);
  overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .card{animation:none} }
.card.busy{background:transparent;border-style:dashed}
.ch{display:flex;align-items:flex-start;gap:20px;padding:24px 24px 16px}
.ch .nm{flex:1;min-width:0}
.ch .nm .t{font-size:26px;font-weight:460;letter-spacing:-.02em;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .nm .f{font-size:13px;color:var(--stone);margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 확정 오류 — 화면에서 유일한 채색 채움 */
.verdict{flex:none;display:flex;align-items:baseline;gap:9px;background:var(--wine);
  color:var(--paper);border-radius:var(--r-full);padding:9px 18px}
.verdict.none{background:transparent;color:var(--stone);padding:9px 0;
  box-shadow:inset 0 0 0 1px var(--mist);border-radius:var(--r-full);padding:9px 18px}
.verdict .n{font-size:22px;font-weight:540;letter-spacing:-.02em;line-height:1}
.verdict .c{font-size:13px;opacity:.8}

.metas{display:flex;flex-wrap:wrap;gap:0 24px;padding:0 24px 18px;font-size:14px;color:var(--stone)}
.metas b{color:var(--charcoal);font-weight:540}

.peek{background:var(--parchment);padding:18px 24px 20px;border-top:1px solid var(--mist)}
.peek .h{font-size:12px;color:var(--stone);margin-bottom:11px;letter-spacing:.02em}
.fi{display:flex;gap:11px;padding:5px 0;font-size:14px;line-height:1.5;align-items:baseline}
.fi .tg{flex:none;font-size:11px;font-weight:700;border-radius:var(--r-full);padding:3px 9px}
.fi .tg.mm{background:var(--wine);color:var(--paper)}
.fi .tg.rv{background:var(--paper);border:1px solid var(--mist);color:var(--stone)}
.fi .tx{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi .tx b{font-weight:540}
.fi .tx i{font-style:normal;color:var(--stone)}

.acts{display:flex;flex-wrap:wrap;gap:8px;padding:18px 24px 22px;border-top:1px solid var(--mist)}
.acts button{font-family:inherit;font-size:15px;font-weight:460;cursor:pointer;transition:.16s;
  border-radius:var(--r-sm);padding:8px 16px;border:1px solid var(--mist);
  background:var(--paper);color:var(--charcoal)}
.acts button:hover{border-color:var(--charcoal)}
.acts button.primary{background:var(--lilac);border-color:var(--charcoal)}
.acts button.primary:hover{background:#c7b6ff}

/* ── 꼬리말 ── */
footer{margin-top:96px;border-top:1px solid var(--mist);padding:26px 0 44px}
.foot{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--stone);align-items:baseline}
.foot .b{color:var(--charcoal);font-weight:540}
</style></head><body>

<div class="hdr" id="hdr"><div class="shell hdrin">
  <button class="logo" id="logo"><span class="n">ARI</span><span class="t">Audit Review Intelligence</span></button>
  <div class="tabs">
    <button data-go="review">검토</button>
    <button data-go="diff">비교</button>
  </div>
</div></div>

<main>

<section id="pane-review" class="view">
  <div class="glow"></div>
  <div class="shell">
    <div class="warn" id="boot">
      <b>지금은 「보기」 상태입니다.</b> 메일·메신저·문서앱의 미리보기 창에서는 눌러도 반응하지 않습니다.
      파일을 내려받아 Chrome 또는 Edge 에서 직접 열어 주세요.
    </div>
    <h1>검토<span class="en">Review</span></h1>

    <div class="drop" id="rdrop">
      <div class="a">DSD 파일을 끌어다 놓으세요</div>
      <div class="b">DART 제출용 <code>.dsd</code> 원본 그대로 · 연차 · 반기 · 연결 · 별도 · 여러 개 한 번에</div>
      <input type="file" id="rpick" accept=".dsd" multiple hidden>
    </div>
    <div class="bar">
      <button class="btn wine" id="rrun" disabled>검토 시작</button>
      <button class="btn ghost" id="rclear" hidden>비우기</button>
      <span class="note" id="rhint"></span>
    </div>
    <div class="err" id="rerr"></div>
    <div id="cards"></div>
  </div>
</section>

<section id="pane-diff" class="view" hidden>
  <div class="glow"></div>
  <div class="shell">
    <h1>비교<span class="en">Compare</span></h1>

    <div class="slots">
      <div class="slot" id="slotL"><div class="k">이전</div><div class="v empty" id="vL">DSD 파일을 놓으세요</div></div>
      <button class="swap" id="swap" title="자리 바꾸기">⇄</button>
      <div class="slot" id="slotR"><div class="k">이후</div><div class="v empty" id="vR">DSD 파일을 놓으세요</div></div>
    </div>
    <div class="shelf" id="shelf">
      <div class="sh">보관함</div>
      <div class="chips" id="chips"></div>
    </div>
    <input type="file" id="dpick" accept=".dsd" multiple hidden>
    <div class="bar">
      <button class="btn wine" id="drun" disabled>비교 시작</button>
      <button class="btn lilac" id="dadd">파일 추가</button>
      <button class="btn ghost" id="dclear" hidden>비우기</button>
      <span class="note" id="dhint"></span>
    </div>
    <div class="err" id="derr"></div>
    <div id="dcards"></div>
  </div>
</section>

</main>

<footer><div class="shell foot" id="foot"></div></footer>

<title>\uAC10\uC0AC\uBCF4\uACE0\uC11C \uAC80\uD1A0 \uACB0\uACFC \xB7 ${P(r??"")}</title>
<style>
/* \uB514\uC790\uC778 \uC5B8\uC5B4: \uBB34\uCC44\uC0C9 \uCE94\uBC84\uC2A4 + \uC808\uC81C\uB41C \uC758\uBBF8\uC0C9, \uC54C\uC57D\uD615 \uCEE8\uD2B8\uB864, \uB450 \uC885\uB958\uC758 \uCE74\uB4DC \uBC18\uACBD
   (32px = \uACB0\uACFC \uC120\uC5B8 \uCE74\uB4DC / 16px = \uB0B4\uC6A9 \uCE74\uB4DC). \uC11C\uCCB4\uB294 DM Sans \uC6B0\uC120, \uC5C6\uC73C\uBA74 \uC2DC\uC2A4\uD15C \uD3F0\uD2B8.
   \uD3F0\uD2B8\uB97C \uB124\uD2B8\uC6CC\uD06C\uC5D0\uC11C \uBC1B\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC624\uD504\uB77C\uC778\xB7\uD3D0\uC1C4\uB9DD\uC5D0\uC11C\uB3C4 \uB3D9\uC77C\uD558\uAC8C \uBCF4\uC5EC\uC57C \uD55C\uB2E4(\xA718). */
:root{
--ink:#111214;--ink-strong:#000;--charcoal:#2E3033;--slate:#5B5F66;--steel:#8A9098;--stone:#A8AEB6;--muted:#C2C7CE;
--canvas:#F2F0EB;--surface:#FFFFFF;--surface-soft:#FAF9F6;--hairline:#E3E3E2;--hairline-soft:#EDEBE6;
--red:#BCA9F5;--red-ink:#421D24;--red-bg:#D4C7FF;
--amber:#421D24;--amber-bg:#D4C7FF;
--green:#666666;--green-bg:#FFFFFF;
--blue:#1D4ED8;--blue-bg:#EAF1FE;
--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-hero:28px;--r-full:9999px}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);
font-family:"DM Sans",Inter,Pretendard,-apple-system,"Malgun Gothic","\uB9D1\uC740 \uACE0\uB515",sans-serif;
font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px 96px}

/* \u2500\u2500 \uC0C1\uB2E8 \uB0B4\uBE44\uAC8C\uC774\uC158 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
padding:16px 0;margin-bottom:40px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
border-bottom:1px solid var(--hairline-soft)}
.brand{font-size:16px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:9px}
.brand small{font-size:12px;font-weight:500;color:var(--steel);letter-spacing:0}
.badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--r-full);
background:var(--surface);color:var(--slate);border:1px solid var(--hairline)}
.badge.grey{background:transparent}

/* \u2500\u2500 \uD788\uC5B4\uB85C: \uB300\uC0C1\uACFC \uACB0\uB860\uC744 \uBA3C\uC800 \uC120\uC5B8\uD55C\uB2E4 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hero{border-radius:var(--r-hero);padding:40px 44px;margin-bottom:14px;
background:var(--ink);color:#fff}
.hero.bad{background:var(--red)}
.hero.warn{background:#1B1D20}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.62}
.hero h1{margin:10px 0 0;font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-1.4px}
.period{margin:14px 0 0;font-size:15px;font-weight:500;opacity:.78;font-variant-numeric:tabular-nums}
.period .cav{display:block;margin-top:8px;font-size:13px;font-weight:600;
background:rgba(255,255,255,.14);border-radius:var(--r-full);padding:6px 14px;display:inline-block}
.verdict{margin-top:26px;font-size:19px;font-weight:600;line-height:1.45;letter-spacing:-.3px}

/* \u2500\u2500 \uC9C0\uD45C \uC2A4\uD2B8\uB9BD \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 48px}
.m{background:var(--surface);border-radius:var(--r-xl);padding:22px 24px}
.m.bad{background:var(--red-bg)}
.m.good{background:var(--green-bg)}
.m.warn{background:var(--amber-bg)}
.ml{font-size:12px;font-weight:600;color:var(--steel);letter-spacing:.01em}
.mv{font-size:34px;font-weight:600;letter-spacing:-1px;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.mv.red{color:var(--red-ink)}.mv.green{color:var(--green)}.mv.amber{color:var(--amber)}

/* \u2500\u2500 \uC139\uC158 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
h2{font-size:26px;font-weight:600;letter-spacing:-.6px;line-height:1.25;margin:64px 0 6px;
padding-top:26px;border-top:1px solid var(--hairline)}
h2 .n{display:inline-block;min-width:30px;color:var(--stone);font-variant-numeric:tabular-nums}
h3{font-size:17px;font-weight:600;letter-spacing:-.2px;margin:32px 0 10px}
h3 .sub{font-size:13px;font-weight:500;color:var(--steel);letter-spacing:0}
.lead{color:var(--slate);font-size:14px;margin:0 0 20px;max-width:760px;line-height:1.6}

/* \u2500\u2500 \uD45C \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
table{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 8px;font-size:13.5px;
border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden}
thead th{background:var(--surface);color:var(--steel);font-size:12px;font-weight:600;
text-align:left;padding:12px 16px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--hairline-soft);vertical-align:top;color:var(--charcoal)}
tbody tr:last-child td{border-bottom:none}
tbody tr.hi{background:var(--surface-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:500}
.src,.loc{color:var(--steel);font-size:12px;line-height:1.5}
.up{color:var(--red-ink);font-weight:600}.down{color:var(--blue);font-weight:600}

/* \u2500\u2500 \uBC30\uC9C0 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:var(--r-full);white-space:nowrap}
.s-ok{background:var(--green-bg);color:var(--green)}
.s-rev{background:var(--amber-bg);color:var(--amber)}
.s-err{background:var(--red-bg);color:var(--red-ink)}
.s-info{background:var(--surface);color:var(--slate)}

/* \u2500\u2500 \uC99D\uAC10 \uB9C9\uB300 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.barwrap{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.bar{display:inline-block;height:6px;border-radius:var(--r-full)}
.bar.p{background:var(--red)}.bar.n{background:var(--blue)}

/* \u2500\u2500 \uCE74\uB4DC\uB958 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.disc{border:1px solid var(--hairline);border-left:3px solid var(--green);background:var(--canvas);
padding:18px 22px;margin:0 0 22px;border-radius:var(--r-xl)}
.disc.warn2{border-left-color:var(--red);background:var(--red-bg);border-color:#F4DADA}
.disc b{font-size:15px;letter-spacing:-.2px}
.disc p{margin:8px 0 0;font-size:13.5px;color:var(--charcoal);line-height:1.6}
.disc p.cov{color:var(--green);font-weight:600;font-size:13px}

.qcard{border:1px solid var(--hairline);border-radius:var(--r-xl);padding:22px 24px;margin:0 0 12px;background:var(--canvas)}
.qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--steel);margin-bottom:10px}
.qarea{font-weight:600}
.qq{font-size:17px;font-weight:600;line-height:1.45;letter-spacing:-.3px;margin:0 0 10px}
.qb{font-size:13.5px;color:var(--charcoal);font-variant-numeric:tabular-nums;line-height:1.6}
.qp{font-size:13.5px;color:var(--blue);font-weight:500;margin-top:8px}

.ins{border:1px solid var(--hairline);border-radius:var(--r-xl);padding:20px 22px;margin:0 0 12px}
.insq{font-size:16px;font-weight:600;letter-spacing:-.2px;margin-bottom:10px;line-height:1.45}
.insr{font-size:13.5px;color:var(--charcoal);margin:4px 0;line-height:1.6}
.inse{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--steel);line-height:1.7}

/* \u2500\u2500 \uB9C1\uD06C\xB7\uBCF5\uC0AC \uCE69 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
ul.links{font-size:14px;line-height:2.1;padding-left:18px}
ul.links a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--hairline)}
ul.links a:hover{border-bottom-color:var(--ink)}
code.copy{background:var(--ink);color:#fff;border:none;border-radius:var(--r-full);
padding:4px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-block}
code.copy.done{background:var(--green-bg);color:var(--green)}
.hint{color:var(--steel);font-size:12px;font-weight:400}
td.q{color:var(--blue);font-weight:500;font-size:12.5px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--slate);font-size:12.5px;font-weight:500}
.how{font-size:13px;color:var(--charcoal);line-height:1.6}

/* \u2500\u2500 \uBC14\uB2E5\uAE00 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.foot{margin-top:72px;padding:28px 32px;border-radius:var(--r-xl);background:var(--surface);
color:var(--steel);font-size:12px;line-height:1.9;word-break:break-all}
.credit{margin-top:14px;padding-top:18px;border-top:1px solid var(--hairline-soft);
color:var(--steel);font-size:12px;line-height:1.75;max-width:720px}
.credit b{color:var(--slate);font-weight:600}

@media print{.top{position:static;background:none}h2{break-after:avoid}table{break-inside:avoid}}
@media(max-width:900px){

* **\uACF5\uC815\uD55C \uD45C\uC2DC**: \uC7AC\uBB34\uC0C1\uD0DC, \uC7AC\uBB34\uC131\uACFC \uBC0F \uD604\uAE08\uD750\uB984\uC744 \uACF5\uC815\uD558\uAC8C \uD45C\uC2DC\uD574\uC57C \uD558\uBA70, \uAE30\uC900\uC11C\uC758 \uBAA8\uB4E0 \uC694\uAD6C\uC0AC\uD56D\uC744 \uC801\uC6A9\uD558\uC5EC\uC57C \uD568 (IAS 1.15).

### 1.2 \uC911\uC694\uC131(Materiality) \uD310\uB2E8 \uC6D0\uCE59 (IAS 1.29~31, IAS 1.117~117E, \uC2E4\uBB34\uC11C 2)
* **\uBAA9\uC801\uC801\uD569\uD55C \uC815\uBCF4 \uC81C\uACF5**: \uD2B9\uC815 \uACF5\uC2DC \uC694\uAD6C\uC0AC\uD56D\uC774 \uAE30\uC900\uC11C\uC5D0 \uADDC\uC815\uB418\uC5B4 \uC788\uB354\uB77C\uB3C4, \uD574\uB2F9 \uC815\uBCF4\uAC00 \uC911\uC694\uD558\uC9C0 \uC54A\uC740 \uACBD\uC6B0(immaterial) \uACF5\uC2DC\uB97C \uC0DD\uB7B5\uD560 \uC218 \uC788\uC74C. \uBC18\uB300\uB85C \uAE30\uC900\uC11C \uC694\uAD6C\uC0AC\uD56D\uC744 \uCDA9\uC871\uD588\uB354\uB77C\uB3C4 \uD2B9\uC815 \uAC70\uB798\uB098 \uC0C1\uD669\uC758 \uC601\uD5A5\uC744 \uC774\uD574\uD558\uB294 \uB370 \uBD80\uC871\uD558\uB2E4\uBA74 \uCD94\uAC00 \uACF5\uC2DC\uB97C \uC81C\uACF5\uD574\uC57C \uD568.
* **\uBD88\uBA85\uD655\uC131 \uBC29\uC9C0**: \uC911\uC694\uD558\uC9C0 \uC54A\uC740 \uC815\uBCF4\uB97C \uACFC\uB3C4\uD558\uAC8C \uD3EC\uD568\uD558\uC5EC \uC911\uC694\uD55C \uC815\uBCF4\uB97C \uD750\uB9AC\uAC8C(obscuring) \uD558\uAC70\uB098, \uC131\uACA9\uACFC \uAE30\uB2A5\uC774 \uC0C1\uC774\uD55C \uC911\uC694\uD55C \uD56D\uBAA9\uC744 \uD558\uB098\uB85C \uD1B5\uD569\uD574\uC11C\uB294 \uC548 \uB428.
* **\uD68C\uACC4\uC815\uCC45 \uACF5\uC2DC**: \uD45C\uC900\uC801 \uBB38\uAD6C(boilerplate)\uC758 \uB2E8\uC21C \uBC18\uBCF5\uC744 \uC9C0\uC591\uD558\uACE0, \uAE30\uC5C5 \uACE0\uC720\uC758 \uC0C1\uD669(\uC120\uD0DD \uAC00\uB2A5\uD55C \uB300\uC548 \uC911 \uCC44\uD0DD\uD55C \uBC29\uBC95, \uC720\uC758\uC801 \uD310\uB2E8 \uBC0F \uCD94\uC815\uCE58 \uB4F1)\uC744 \uBC18\uC601\uD55C "\uC911\uC694\uD55C \uD68C\uACC4\uC815\uCC45 \uC815\uBCF4(material accounting policy information)"\uB97C \uACF5\uC2DC\uD574\uC57C \uD568.

### 1.3 \uACC4\uC18D\uAE30\uC5C5(Going Concern) \uD3C9\uAC00 \uBC0F \uACF5\uC2DC (IAS 1.25, IFRIC IU 07-10)
1. **\uC911\uB300\uD55C \uBD88\uD655\uC2E4\uC131 \uC874\uC7AC \uC2DC (Material Uncertainty)**:
   - \uAE30\uC5C5\uC758 \uACC4\uC18D\uAE30\uC5C5 \uC874\uC18D\uB2A5\uB825\uC5D0 \uC720\uC758\uC801 \uC758\uBB38\uC744 \uC81C\uAE30\uD560 \uC218 \uC788\uB294 \uC0AC\uAC74\uC774\uB098 \uC0C1\uD669\uC758 \uC138\uBD80 \uB0B4\uC6A9 \uBC0F \uACBD\uC601\uC9C4\uC758 \uB300\uC751/\uC644\uD654 \uACC4\uD68D \uACF5\uC2DC.
   - \uACC4\uC18D\uAE30\uC5C5 \uD3C9\uAC00\uC640 \uAD00\uB828\uD558\uC5EC \uACBD\uC601\uC9C4\uC774 \uB0B4\uB9B0 \uC720\uC758\uC801 \uD310\uB2E8.
   - \uC815\uC0C1\uC801\uC778 \uC601\uC5C5\uACFC\uC815\uC5D0\uC11C \uC790\uC0B0\uC744 \uD68C\uC218\uD558\uACE0 \uBD80\uCC44\uB97C \uC0C1\uD658\uD558\uC9C0 \uBABB\uD560 \uC218\uB3C4 \uC788\uB294 "\uC911\uB300\uD55C \uBD88\uD655\uC2E4\uC131\uC774 \uC874\uC7AC\uD55C\uB2E4\uB294 \uBA85\uC2DC\uC801 \uC9C4\uC220".
2. **\uC544\uC2AC\uC544\uC2AC\uD55C \uC0C1\uD669 (Close-call Scenario)**:
   - \uACC4\uC18D\uAE30\uC5C5 \uAC00\uC815\uC5D0 \uC720\uC758\uC801 \uC758\uBB38\uC774 \uC81C\uAE30\uB418\uC5C8\uC73C\uB098 \uBA74\uBC00\uD55C \uAC80\uD1A0 \uB05D\uC5D0 \uC911\uB300\uD55C \uBD88\uD655\uC2E4\uC131\uC774 \uC5C6\uB2E4\uACE0 \uACB0\uB860\uC744 \uB0B4\uB9B0 \uACBD\uC6B0, \uADF8\uB7EC\uD55C \uACB0\uB860\uC5D0 \uB3C4\uB2EC\uD558\uAE30\uAE4C\uC9C0 \uC801\uC6A9\uB41C \uACBD\uC601\uC9C4\uC758 \uC720\uC758\uC801 \uD310\uB2E8(IAS 1.122)\uC744 \uC8FC\uC11D\uC5D0 \uACF5\uC2DC.
3. **\uACC4\uC18D\uAE30\uC5C5 \uAE30\uC900 \uBBF8\uC801\uC6A9 \uC2DC**:
   - \uC7AC\uBB34\uC81C\uD45C\uAC00 \uACC4\uC18D\uAE30\uC5C5 \uAE30\uC900\uC73C\uB85C \uC791\uC131\uB418\uC9C0 \uC54A\uC558\uB2E4\uB294 \uC0AC\uC2E4, \uC7AC\uBB34\uC81C\uD45C \uC791\uC131 \uAE30\uC900(\uCCAD\uC0B0\uAE30\uC900 \uB4F1), \uBC0F \uACC4\uC18D\uAE30\uC5C5\uC73C\uB85C \uBCF4\uC9C0 \uC54A\uB294 \uC0AC\uC720 \uACF5\uC2DC.

### 1.4 \uC5F0\uACC4 \uBCF4\uACE0(Connected Reporting) \uBC0F \uBD88\uD655\uC2E4\uC131/\uAE30\uD6C4 \uACF5\uC2DC (KPMG \uD2B9\uD654 \uAD8C\uACE0\uC0AC\uD56D)
* **\uBCF4\uACE0\uC11C \uC804\xB7\uD6C4\uBA74\uC758 \uC815\uD569\uC131 (Connectivity)**: \uC0AC\uC5C5\uBCF4\uACE0\uC11C \uC55E\uB2E8(MD&A, \uC804\uB7B5, ESG/\uC9C0\uC18D\uAC00\uB2A5\uC131 \uBCF4\uACE0\uC11C)\uACFC \uB4B7\uB2E8(\uC7AC\uBB34\uC81C\uD45C \uC8FC\uC11D)\uC758 \uC2A4\uD1A0\uB9AC\uAC00 \uC77C\uCE58\uD574\uC57C \uD568. \uAE30\uD6C4\uBCC0\uD654 \uB9AC\uC2A4\uD06C, \uACF5\uAE09\uB9DD \uCC28\uC9C8, \uACE0\uAE08\uB9AC\xB7\uC778\uD50C\uB808\uC774\uC158 \uC601\uD5A5 \uB4F1\uC774 \uC790\uC0B0\uC190\uC0C1\uD3C9\uAC00(IAS 36), \uB0B4\uC6A9\uC5F0\uC218 \uAC80\uD1A0(IAS 16), \uBCF5\uAD6C\uCDA9\uB2F9\uBD80\uCC44(IAS 37), \uACF5\uC815\uAC00\uCE58 \uCE21\uC815(IFRS 13)\uC5D0 \uC77C\uAD00\uB418\uAC8C \uBC18\uC601\uB418\uC5C8\uB294\uC9C0 \uC810\uAC80.

### 1.5 2025/2026\uB144 \uC2DC\uD589 \uAC1C\uC815 \uAE30\uC900\uC11C \uD575\uC2EC \uCCB4\uD06C\uD3EC\uC778\uD2B8
* **IFRS 9 / IFRS 7 \uAE08\uC735\uC0C1\uD488 \uBD84\uB958 \uBC0F \uCE21\uC815 \uAC1C\uC815**:
  - \uAE30\uBCF8 \uB300\uC5EC \uC704\uD5D8/\uBE44\uC6A9\uACFC \uC9C1\uC811 \uAD00\uB828 \uC5C6\uB294 \uC870\uAC74\uBD80 \uC0AC\uC720(ESG/\uD0C4\uC18C\uBC30\uCD9C \uBAA9\uD45C \uC5F0\uACC4 \uB4F1)\uB85C \uACC4\uC57D\uC0C1 \uD604\uAE08\uD750\uB984\uC774 \uBCC0\uB3D9\uD558\uB294 \uAE08\uC735\uC790\uC0B0/\uAE08\uC735\uBD80\uCC44\uC5D0 \uB300\uD55C \uC815\uC131\uC801\xB7\uC815\uB7C9\uC801 \uACF5\uC2DC \uC758\uBB34\uD654.
  - \uAE30\uD0C0\uD3EC\uAD04\uC190\uC775-\uACF5\uC815\uAC00\uCE58(FVOCI) \uC120\uD0DD \uC9C0\uBD84\uC0C1\uD488\uC758 \uACF5\uC2DC \uAC15\uD654 (\uAE30\uC911 \uC778\uC2DD\uB41C OCI \uBC0F \uC81C\uAC70 \uC2DC \uB300\uCCB4\uB41C \uB204\uC801\uC190\uC775 \uC138\uBD84\uD654).
  - \uC804\uC790\uC9C0\uAE09\uC2DC\uC2A4\uD15C\uC744 \uD1B5\uD55C \uAE08\uC735\uBD80\uCC44 \uACB0\uC81C \uC2DC\uC810 \uC81C\uAC70 \uC608\uC678\uADDC\uC815 \uC801\uC6A9 \uC5EC\uBD80.
* **\uAE30\uD6C4/\uC790\uC5F0\uC758\uC874\uC131 \uC804\uB825 PPA \uACC4\uC57D (Contracts Referencing Nature-dependent Electricity)**:
  - \uC804\uB825 PPA(\uC790\uC5F0\uC870\uAC74\uC5D0 \uB530\uB77C \uBC1C\uC804\uB7C9\uC774 \uBCC0\uB3D9\uD558\uB294 \uACC4\uC57D)\uC758 \uC790\uCCB4\uC0AC\uC6A9(Own-use) \uBA74\uC81C \uC801\uC6A9 \uC2DC \uD604\uAE08\uD750\uB984 \uC601\uD5A5, \uC57D\uC815\uC0AC\uD56D, \uC789\uC5EC\uC804\uB825 \uB9E4\uAC01\uC190\uC775 \uB4F1 \uB2E8\uC77C \uC8FC\uC11D \uC9D1\uC911 \uACF5\uC2DC.
* **IAS 12 Pillar Two \uAE00\uB85C\uBC8C \uCD5C\uC800\uD55C\uC138**:
  - \uC774\uC5F0\uBC95\uC778\uC138 \uC778\uC2DD/\uACF5\uC2DC \uBA74\uC81C \uC0AC\uC2E4 \uBA85\uC2DC \uBC0F \uB2F9\uAE30\uBC95\uC778\uC138 \uBE44\uC6A9 \uBCC4\uB3C4 \uACF5\uC2DC, \uBC95\uB960 \uC81C\uC815 \uD6C4 \uBBF8\uBC1C\uD6A8 \uAE30\uAC04 \uC911 \uC7A0\uC7AC\uC801 \uC775\uC2A4\uD3EC\uC800 \uACF5\uC2DC.
* **IAS 21 \uAD50\uD658\uAC00\uB2A5\uC131\uC758 \uACB0\uC5EC (Lack of Exchangeability)**:
  - \uD1B5\uD654 \uAC04 \uAD50\uD658\uC131\uC774 \uACB0\uC5EC\uB418\uC5B4 \uCD94\uC815 \uD658\uC728\uC744 \uC801\uC6A9\uD55C \uACBD\uC6B0 \uCD94\uC815 \uAE30\uBC95, \uC0AC\uC6A9 \uD658\uC728, \uB178\uCD9C \uC704\uD5D8 \uACF5\uC2DC.

## 6. \uC81C5\uBD80: \uCC28\uAE30 \uC801\uC6A9 \uC608\uC815 \uAE30\uC900\uC11C \uC0AC\uC804 \uC900\uBE44 (Forthcoming Requirements Preview)

### 6.1 IFRS 18 \uC7AC\uBB34\uC81C\uD45C\uC758 \uD45C\uC2DC \uBC0F \uACF5\uC2DC (IFRS 18 Presentation and Disclosure in Financial Statements)
* **\uC2DC\uD589\uC77C**: 2027\uB144 1\uC6D4 1\uC77C \uC774\uD6C4 \uAC1C\uC2DC\uD558\uB294 \uD68C\uACC4\uC5F0\uB3C4\uBD80\uD130 \uC758\uBB34 \uC801\uC6A9 (\uC870\uAE30\uC801\uC6A9 \uAC00\uB2A5, IAS 1 \uB300\uCCB4).
* **\uC8FC\uC694 \uBCC0\uACBD\uC0AC\uD56D \uBC0F \uC0AC\uC804 \uC810\uAC80 \uD3EC\uC778\uD2B8**:
  1. **\uC190\uC775\uACC4\uC0B0\uC11C 5\uB300 \uBC94\uC8FC \uAD6C\uBD84 \uBC0F \uC18C\uACC4 \uB3C4\uC785**:
     - \uC190\uC775\uACC4\uC0B0\uC11C\uC758 \uC218\uC775 \uBC0F \uBE44\uC6A9 \uD56D\uBAA9\uC744 **\uC6B4\uC601(Operating)**, **\uD22C\uC790(Investing)**, **\uC7AC\uBB34(Financing)**, \uBC95\uC778\uC138, \uC911\uB2E8\uC601\uC5C5\uC758 5\uAC1C \uBC94\uC8FC\uB85C \uC5C4\uACA9\uD788 \uBD84\uB958.
     - \uD544\uC218 \uC18C\uACC4\uC778 **'\uC601\uC5C5\uC774\uC775(Operating profit or loss)'** \uBC0F **'\uD22C\uC790\xB7\uC7AC\uBB34 \uC804 \uC190\uC775(Profit or loss before financing and income taxes)'**\uC744 \uBCF8\uBB38\uC5D0 \uBC18\uB4DC\uC2DC \uD45C\uC2DC\uD574\uC57C \uD568.
  2. **\uACBD\uC601\uC9C4 \uC815\uC758 \uC131\uACFC\uCE21\uC815\uCE58 (MPMs, Management Performance Measures) \uC8FC\uC11D \uACF5\uC2DC**:
     - \uAE30\uC5C5\uC774 \uC7AC\uBB34\uC81C\uD45C \uC678(IR \uC790\uB8CC, \uBCF4\uB3C4\uC790\uB8CC \uB4F1)\uC5D0\uC11C \uB300\uC678\uC801\uC73C\uB85C \uC0AC\uC6A9\uD558\uB294 \uBE44GAAP(Non-GAAP) \uC131\uACFC\uC9C0\uD45C(\uC608: \uC870\uC815 \uC601\uC5C5\uC774\uC775, \uC870\uC815 EBITDA \uB4F1)\uB97C \uC8FC\uC11D\uC5D0 \uC815\uC758\uD558\uACE0, IFRS \uACF5\uC2DC \uC18C\uACC4\uC640\uC758 \uD654\uD574(Reconciliation), \uC138\uAE08 \uBC0F \uBE44\uC9C0\uBC30\uC9C0\uBD84 \uD6A8\uACFC, \uD574\uB2F9 \uC9C0\uD45C\uC758 \uC720\uC6A9\uC131\uC744 \uACF5\uC2DD \uACF5\uC2DC\uD574\uC57C \uD568.
  3. **\uD1B5\uD569 \uBC0F \uC138\uBD84\uD654(Aggregation and Disaggregation) \uC9C0\uCE68 \uAC15\uD654**:
     - '\uAE30\uD0C0' \uD56D\uBAA9\uC758 \uACFC\uB3C4\uD55C \uD1B5\uD569 \uAE08\uC9C0 \uBC0F \uC131\uACA9\uBCC4/\uAE30\uB2A5\uBCC4 \uC138\uBD84\uD654 \uC9C0\uCE68 \uAD6C\uCCB4\uD654.

### 6.2 IFRS 19 \uACF5\uC2DC\uC758\uBB34 \uACBD\uAC10 \uB300\uC0C1 \uC790\uD68C\uC0AC (IFRS 19 Subsidiaries without Public Accountability: Disclosures)
* **\uC2DC\uD589\uC77C**: 2027\uB144 1\uC6D4 1\uC77C \uC774\uD6C4 \uAC1C\uC2DC\uD558\uB294 \uD68C\uACC4\uC5F0\uB3C4\uBD80\uD130 \uC801\uC6A9 (\uC870\uAE30\uC801\uC6A9 \uAC00\uB2A5).

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function readAB(f){return new Promise(function(res,rej){
  var r=new FileReader();
  r.onload=function(){res(new Uint8Array(r.result));};
  r.onerror=function(){rej(new Error(f.name+' 파일을 읽지 못했습니다.'));};
  r.readAsArrayBuffer(f);});}
function isDsd(f){return /\.dsd$/i.test(f.name);}
function friendly(m){
  return /zip|contents\.xml|EOCD/i.test(m)
    ? 'DSD 파일을 읽을 수 없습니다. 올바른 감사보고서 .dsd 인지 확인해 주세요.\n\n('+m+')'
    : m;
}
/** 큰 HTML 을 새 탭에. document.write 라야 자식 창에서 코멘트를 걷어 올 수 있다. */
function openHtml(html){
  var w=window.open('','_blank');
  if(!w){ alert('팝업이 막혀 있습니다. 주소창 오른쪽의 팝업 차단을 풀고 다시 눌러 주세요.'); return null; }
  w.document.write(html); w.document.close(); return w;
}
function dl(bytes,name,mime){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([bytes],{type:mime}));
  a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
function ymd(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}

/* ── 화면 전환 ── */
var VIEWS={review:'pane-review',diff:'pane-diff'};
function go(which,push){
  if(!VIEWS[which]) which='review';
  for(var k in VIEWS) $(VIEWS[k]).hidden = (k!==which);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.classList.toggle('on', b.dataset.go===which);
  });
  if(push!==false){
    var h='#'+which;
    if(location.hash!==h){ try{ history.replaceState(null,'',h); }catch(e){ location.hash=h; } }
  }
  window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){
  b.addEventListener('click',function(){ go(b.dataset.go); });
});
$('logo').addEventListener('click',function(){ go('review'); });
window.addEventListener('hashchange',function(){ go((location.hash||'').replace('#',''),false); });
window.addEventListener('scroll',function(){
  $('hdr').classList.toggle('stuck', window.scrollY>6);
},{passive:true});

function wireDrop(el,onFiles){
  ['dragenter','dragover'].forEach(function(ev){
    el.addEventListener(ev,function(e){e.preventDefault();el.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){
    el.addEventListener(ev,function(e){e.preventDefault();el.classList.remove('over');});});
  el.addEventListener('drop',function(e){onFiles(e.dataTransfer.files);});
}
// 빗나간 파일이 브라우저에서 열려 작업이 날아가지 않게 창 전체의 기본 동작을 막는다.
['dragover','drop'].forEach(function(ev){
  window.addEventListener(ev,function(e){e.preventDefault();},false);});

/* ══ 검토 ══ */
var rFiles=[], rRun=$('rrun'), rClear=$('rclear'), rHint=$('rhint'), rErr=$('rerr'), cards=$('cards');

function rSync(){
  rRun.disabled = rFiles.length===0;
  rClear.hidden = rFiles.length===0;
  rHint.innerHTML = rFiles.length ? '<b>'+rFiles.length+'</b>건 대기' : '';
}
function rAdd(list){
  rErr.style.display='none';
  var bad=[];
  Array.prototype.forEach.call(list,function(f){
    if(!isDsd(f)){ bad.push(f.name); return; }
    if(!rFiles.some(function(x){return x.name===f.name&&x.size===f.size;})) rFiles.push(f);
  });
  if(bad.length){ rErr.textContent='DART 제출용 .dsd 원본만 넣을 수 있습니다 (PDF·한글·엑셀은 읽지 못합니다) — 제외됨: '+bad.join(', ');
                  rErr.style.display='block'; }
  rSync();
}
$('rdrop').addEventListener('click',function(){$('rpick').click();});
$('rpick').addEventListener('change',function(e){rAdd(e.target.files);e.target.value='';});
wireDrop($('rdrop'),rAdd);
rClear.addEventListener('click',function(){rFiles=[];rSync();});

var HEALTH={ok:'읽기 정상',partial:'일부만 읽음',failed:'못 읽은 부분 있음'};

function busyCard(name,verb){
  var el=document.createElement('div'); el.className='card busy';
  el.innerHTML='<div class="ch"><div class="nm"><div class="t"><span class="spin"></span> '+esc(verb)+'…</div>'
    +'<div class="f">'+esc(name)+'</div></div></div>';
  return el;
}
/** 설명이 항목 이름으로 시작하면 그 앞부분을 뗀다 — 카드에서는 같은 말이 두 번 읽힌다. */
function trimEcho(subject,note){
  var core=String(subject||'').replace(/\s*\[[^\]]*\]\s*$/,'').trim();
  if(!core||!note) return note||'';
  var n=String(note);
  if(n.indexOf(core)!==0) return n;
  var rest=n.slice(core.length).replace(/^\s*(당기|전기|당기말|전기말|당반기|전반기)?\s*[:：]?\s*/,'');
  return rest.length>10 ? rest : n;
}
function fiRow(f){
  var mm=f.status==='mismatch', subj=(f.subject||'').trim();
  return '<div class="fi"><span class="tg '+(mm?'mm':'rv')+'">'+(mm?'확정':'확인')+'</span>'
    +'<span class="tx">'+(subj?'<b>'+esc(subj)+'</b> ':'')
    +'<i>'+esc(trimEcho(subj,f.note))+'</i></span></div>';
}
function reviewCard(r,fname){
  var el=document.createElement('div'); el.className='card';
  var metas=['검증 <b>'+r.total.toLocaleString()+'</b>',
             '확인 권장 <b>'+r.review+'</b>',
             HEALTH[r.health]||HEALTH.ok];
  if(r.disclosureCount>0) metas.push('공시 점검 <b>'+r.disclosureCount+'</b>');
  var top=(r.top&&r.top.length) ? r.top.map(fiRow).join('')
    : '<div class="fi"><span class="tx"><i>지적 없음 — 수행한 검증이 모두 일치했습니다.</i></span></div>';
  // 기간은 「제36기」까지만. 뒤의 날짜 범위는 제목 줄만 늘린다.
  var term=(r.period||'').split(' · ')[0];
  el.innerHTML=
    '<div class="ch"><div class="nm"><div class="t">'+esc((r.company||'감사보고서')+(term?' · '+term:''))+'</div>'
      +'<div class="f">'+esc(fname)+'</div></div>'
      +'<div class="verdict'+(r.mismatch>0?'':' none')+'">'
        +'<span class="n tab">'+r.mismatch+'</span><span class="c">확정 오류</span></div></div>'
    +'<div class="metas">'+metas.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div>'
    +'<div class="peek"><div class="h">먼저 볼 것</div>'+top+'</div>'
    +'<div class="acts">'
      +'<button class="primary" data-a="review">검토화면 열기</button>'
      +'<button data-a="xlsx">엑셀 조서</button>'
      +'<button data-a="docx">워드 리포트</button>'
      +'<button data-a="dash">요약</button>'
    +'</div>';
  var base=(r.company||'감사보고서').replace(/[\\/:*?"<>|]/g,'');
  el.querySelector('[data-a=review]').onclick=function(){openHtml(r.reviewHtml);};
  el.querySelector('[data-a=dash]').onclick=function(){openHtml(r.dashboardHtml);};
  el.querySelector('[data-a=xlsx]').onclick=function(){
    dl(r.xlsx,base+'_감사조서_'+ymd()+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');};
  el.querySelector('[data-a=docx]').onclick=function(){
    dl(r.docx,base+'_검토리포트_'+ymd()+'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document');};
  return el;
}
function failCard(name,msg){
  var el=document.createElement('div'); el.className='card';
  el.innerHTML='<div class="ch"><div class="nm"><div class="t">읽지 못했습니다</div>'
    +'<div class="f">'+esc(name)+'</div></div></div>'
    +'<div class="peek"><div class="fi"><span class="tx"><i>'+esc(msg)+'</i></span></div></div>';
  return el;
}

rRun.addEventListener('click',function(){
  if(!rFiles.length) return;
  rRun.disabled=true; rClear.disabled=true; rErr.style.display='none';
  var queue=rFiles.slice(); rFiles=[]; rSync();
  var chain=Promise.resolve();
  queue.forEach(function(f){
    chain=chain.then(function(){
      var busy=busyCard(f.name,'검토 중'); cards.insertBefore(busy,cards.firstChild);
      return readAB(f)
        .then(function(bytes){ return ARI.reviewInBrowser(bytes); })
        .then(function(r){ cards.replaceChild(reviewCard(r,f.name),busy); })
        .catch(function(e){ cards.replaceChild(failCard(f.name,friendly((e&&e.message)||String(e))),busy); });
    });
  });
  chain.then(function(){ rRun.disabled=rFiles.length===0; rClear.disabled=false; });
});

/* ══ 비교 ══ */
var dShelf=[], dF={L:null,R:null}, dRun=$('drun'), dClear=$('dclear'),
    dErr=$('derr'), dcards=$('dcards'), chips=$('chips'), dHint=$('dhint'), pendingSide=null;

function sameFile(a,b){ return !!a && !!b && a.name===b.name && a.size===b.size; }

function dSync(){
  [['L',$('vL'),$('slotL')],['R',$('vR'),$('slotR')]].forEach(function(t){
    var f=dF[t[0]];
    t[1].textContent = f ? f.name : 'DSD 파일을 놓으세요';
    t[1].className = 'v'+(f?'':' empty');
    t[2].classList.toggle('set',!!f);
  });
  if(dShelf.length===0){
    chips.innerHTML='<span class="empty">DSD 파일을 여러 개 한 번에 놓으면 여기 쌓입니다.</span>';
  } else {
    chips.innerHTML='';
    dShelf.forEach(function(f,i){
      var slot = sameFile(f,dF.L) ? '이전' : sameFile(f,dF.R) ? '이후' : '';
      var c=document.createElement('button');
      c.className='chip'+(slot?' on':'');
      c.innerHTML='<span class="nm">'+esc(f.name)+'</span>'
        +(slot?'<span class="sl">'+slot+'</span>':'')
        +'<span class="x" title="보관함에서 빼기">×</span>';
      c.addEventListener('click',function(e){
        if(e.target.className==='x'){
          if(sameFile(f,dF.L)) dF.L=null;
          if(sameFile(f,dF.R)) dF.R=null;
          dShelf.splice(i,1); dSync(); return;
        }
        assign(f);
      });
      chips.appendChild(c);
    });
  }
  dRun.disabled = !(dF.L && dF.R);
  dClear.hidden = dShelf.length===0 && !dF.L && !dF.R;
  dHint.textContent = (dF.L&&dF.R) ? '' : (dShelf.length ? '보관함에서 이전과 이후를 고르세요' : '');
}
/** 빈 자리를 앞에서부터 채운다. 둘 다 차 있으면 「이후」를 바꾼다. 빼는 것은 × 로만. */
function assign(f){
  if(sameFile(f,dF.L) || sameFile(f,dF.R)) return;
  if(!dF.L) dF.L=f; else dF.R=f;
  dSync();
}
function dAdd(list,side){
  dErr.style.display='none';
  var bad=[], added=[];
  Array.prototype.forEach.call(list,function(f){
    if(!isDsd(f)){ bad.push(f.name); return; }
    if(!dShelf.some(function(x){return sameFile(x,f);})) dShelf.push(f);
    added.push(f);
  });
  if(bad.length){ dErr.textContent='DART 제출용 .dsd 원본만 넣을 수 있습니다 (PDF·한글·엑셀은 읽지 못합니다) — 제외됨: '+bad.join(', ');
                  dErr.style.display='block'; }
  if(added.length===0){ dSync(); return; }
  if(side){ dF[side]=added[0]; }
  else if(!dF.L && !dF.R && added.length===2){
    // 딱 둘을 놓았을 때만 이름 순으로 이전·이후를 정한다(20260210_… → 20260318_…, v1 → vF).
    var srt=added.slice().sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
    dF.L=srt[0]; dF.R=srt[1];
  }
  else if(added.length>2){ /* 셋 이상은 보관함에만 — 어느 짝을 볼지는 사람만 안다 */ }
  else if(!dF.L) dF.L=added[0];
  else if(!dF.R) dF.R=added[0];
  dSync();
}
[['slotL','L'],['slotR','R']].forEach(function(t){
  var el=$(t[0]);
  el.addEventListener('click',function(){ pendingSide=t[1]; $('dpick').click(); });
  wireDrop(el,function(list){ dAdd(list,t[1]); });
});
$('dadd').addEventListener('click',function(){ pendingSide=null; $('dpick').click(); });
wireDrop($('shelf'),function(list){ dAdd(list,null); });
$('dpick').addEventListener('change',function(e){ dAdd(e.target.files,pendingSide); e.target.value=''; pendingSide=null; });
$('swap').addEventListener('click',function(){ var t=dF.L; dF.L=dF.R; dF.R=t; dSync(); });
dClear.addEventListener('click',function(){ dShelf=[]; dF.L=null; dF.R=null; dcards.innerHTML=''; dSync(); });

function diffCard(r,names){
  var el=document.createElement('div'); el.className='card';
  var head = r.same ? '두 파일이 동일합니다'
           : r.total===0 ? '구조적 차이 없음'
           : '변경 '+r.total.toLocaleString()+'건';
  var metas=[];
  if(r.amount>0)       metas.push('금액 변경 <b>'+r.amount.toLocaleString()+'</b>');
  if(r.addedRemoved>0) metas.push('추가·삭제 <b>'+r.addedRemoved.toLocaleString()+'</b>');
  if(r.noteRef>0)      metas.push('주석 참조 <b>'+r.noteRef.toLocaleString()+'</b>');
  if(!metas.length)    metas.push('차이 없음');
  el.innerHTML=
    '<div class="ch"><div class="nm"><div class="t">'+esc(head)+'</div>'
      +'<div class="f">'+esc(names.left)+' → '+esc(names.right)+'</div></div></div>'
    +'<div class="metas">'+metas.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div>'
    +'<div class="acts">'
      +'<button class="primary" data-a="view">비교화면 열기</button>'
      +'<button data-a="xlsx">엑셀 변경내역</button>'
      +'<button data-a="save">화면 저장</button>'
    +'</div>';
  var win=null;
  el.querySelector('[data-a=view]').onclick=function(){ win=openHtml(r.html); };
  el.querySelector('[data-a=save]').onclick=function(){
    dl(new TextEncoder().encode(r.html), r.fileBase+'_'+ymd()+'.html','text/html;charset=utf-8'); };
  el.querySelector('[data-a=xlsx]').onclick=function(){
    // 비교화면에서 적은 코멘트를 걷어 온다. 창을 닫았으면 코멘트 없이 나간다.
    var cm={};
    try{
      if(win && !win.closed && win.document)
        Array.prototype.forEach.call(win.document.querySelectorAll('input.cmt'),function(i){
          var v=(i.value||'').trim(); if(v) cm[i.dataset.a]=v; });
    }catch(e){ /* 접근할 수 없으면 코멘트 없이 진행 */ }
    var input={}; for(var k in r.xlsxInput) input[k]=r.xlsxInput[k];
    input.comments=cm;
    dl(DSDDIFF.buildXlsx(input), r.fileBase+'_'+ymd()+'.xlsx',
       'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); };
  return el;
}

dRun.addEventListener('click',function(){
  if(!(dF.L&&dF.R)) return;
  dRun.disabled=true; dErr.style.display='none';
  var names={left:dF.L.name,right:dF.R.name};
  var busy=busyCard(names.left+' → '+names.right,'비교 중');
  dcards.insertBefore(busy,dcards.firstChild);
  Promise.all([readAB(dF.L),readAB(dF.R)])
    .then(function(b){ return DSDDIFF.compareInBrowser(b[0],b[1],names); })
    .then(function(r){ dcards.replaceChild(diffCard(r,names),busy); })
    .catch(function(e){ dcards.replaceChild(failCard(names.left+' → '+names.right,
      friendly((e&&e.message)||String(e))),busy); })
    .then(function(){ dRun.disabled=false; });
});
